name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift --version

      - run: swift build

      - run: swift test

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - run: brew install swiftlint swiftformat

      - run: swiftformat --lint .

      - run: swiftlint lint --strict

  platforms:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            sdk: iphoneos
            target: arm64-apple-ios15.0
          - name: tvOS
            sdk: appletvos
            target: arm64-apple-tvos15.0
          - name: watchOS
            sdk: watchos
            target: arm64_32-apple-watchos8.0
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          swift build \
            --sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            -Xswiftc -target -Xswiftc ${{ matrix.target }}

  sample:
    name: Sample app (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: ConfigDirectorOpenFeatureSample
            destination: generic/platform=iOS Simulator
          - name: macOS
            scheme: ConfigDirectorOpenFeatureSampleMac
            destination: generic/platform=macOS
          - name: tvOS
            scheme: ConfigDirectorOpenFeatureSampleTV
            destination: generic/platform=tvOS Simulator
          - name: watchOS
            scheme: ConfigDirectorOpenFeatureSampleWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          xcodebuild build \
            -workspace Samples/ConfigDirectorOpenFeatureSample-Local.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -quiet
