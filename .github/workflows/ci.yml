name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift --version

      - run: swift build

      - run: swift test

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SWIFTFORMAT_VERSION: 0.64.0
      SWIFTFORMAT_SHA256: 95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftFormat and SwiftLint
        run: |
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$tools/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTFORMAT_SHA256  $tools/swiftformat.zip" | shasum -a 256 --check
          echo "$SWIFTLINT_SHA256  $tools/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$tools/swiftformat.zip" swiftformat -d "$tools"
          unzip -q "$tools/swiftlint.zip" swiftlint -d "$tools"
          echo "$tools" >> "$GITHUB_PATH"

      - run: swiftformat --version && swiftlint version

      - run: swiftformat --lint .

      - run: swiftlint lint --strict

  platforms:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            sdk: iphoneos
            target: arm64-apple-ios15.0
          - name: tvOS
            sdk: appletvos
            target: arm64-apple-tvos15.0
          - name: watchOS
            sdk: watchos
            target: arm64_32-apple-watchos8.0
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          swift build \
            --sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            -Xswiftc -target -Xswiftc ${{ matrix.target }}

  sample:
    name: Sample app (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: ConfigDirectorOpenFeatureSample
            destination: generic/platform=iOS Simulator
          - name: macOS
            scheme: ConfigDirectorOpenFeatureSampleMac
            destination: generic/platform=macOS
          - name: tvOS
            scheme: ConfigDirectorOpenFeatureSampleTV
            destination: generic/platform=tvOS Simulator
          - name: watchOS
            scheme: ConfigDirectorOpenFeatureSampleWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          xcodebuild build \
            -workspace Samples/ConfigDirectorOpenFeatureSample-Local.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -quiet
