name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/check-release-version.sh "$TAG"

      - env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/changelog-section.sh "${TAG#v}" > /dev/null

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(mktemp)
          .github/scripts/changelog-section.sh "${TAG#v}" > "$notes"

          case "$TAG" in
              *-*) prerelease=--prerelease ;;
              *) prerelease= ;;
          esac

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$notes" \
            $prerelease
